    - [-3.0, 4.0, 0.0, 0.0] # x, y, z, yaw

  # WAREHOUSE ENV EXPERIMENT GOALS, START AT [0,0,0,0]
    # - [-13.0, -12.5, 0.0, 0.0]  # x, y, z, yaw
    # - [9.0, -13.5, 0.0, 0.0]  # x, y, z, yaw
    # - [9.0, -20.0, 0.0, 0.0]  # x, y, z, yaw
    # - [4.0, 4.0, 0.0, 0.0]  # x, y, z, yaw
    # - [-9.0, 7.0, 0.0, 0.0]  # x, y, z, yaw
    # - [10.0, 13.5, 0.0, 0.0]  # x, y, z, yaw
    # - [0.0, 22.0, 0.0, 0.0]  # x, y, z, yaw


    # WAREHOUSE ENV GIF RESULTS, START AT [-10.5, 23.75, 0.0, 0.0]
    # - [5.0, 22.0, 0.0, 0.0]  # x, y, z, yaw
    # - [7.0, 11.5, 0.0, 0.0]  # x, y, z, yaw
    # - [-13.0, -12.5, 0.0, 0.0]  # x, y, z, yaw
    # - [-5.0, -10.0, 0.0, 0.0]  # x, y, z, yaw
    # - [2.0, -14.0, 0.0, 0.0]  # x, y, z, yaw
    # - [9.0, -13.5, 0.0, 0.0]  # x, y, z, yaw
    # - [9.0, -20.0, 0.0, 0.0]  # x, y, z, yaw
    # - [2.0, 2.0, 0.0, 0.0]  # x, y, z, yaw

  goal: #update later
    coordinates:
      - 3.5
      - 0.0
      - 0.0
      - 0.0
    padding:
      - 0.05
      - 0.05
      - 0.5
      - 0.05
    max_time: 30.0
    time_intervals: 101
    solver_accuracy: "high"
  frequency: 30.0
external:
  buffer_time: 1.0  # seconds
  mod_buffer_time: 5.0  # seconds
limits:  # Make sure these are aligned with env.yaml
  max_acc:  0.5 #0.25
  min_acc: -0.5 #-0.25
  max_vel: 0.8 # 0.6
  min_vel: 0.1
  max_omega: 1.0

asif:
  gamma: 0.2
  slack: True
  weighting: [10.0, 1.0]



  
