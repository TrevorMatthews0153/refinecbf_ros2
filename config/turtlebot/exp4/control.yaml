    - [1.2, 3.0, 0.0, 0.0] # x, y, z, yaw
    - [3.5, -3.0, 0.0, 0.0] # x, y, z, yaw
    - [-3.0, -4.0, 0.0, 0.0] # x, y, z, yaw
