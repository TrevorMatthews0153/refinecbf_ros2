controller_type: "PD_acc"  # one of ["PD", "PD_acc", "HJR"]
nominal:
  goal: #update later
    coordinates:
      - 2.5
      - -1.5
      - 0.0
      - 0.0
    padding:
      - 0.05
      - 0.05
      - 0.5
      - 0.05
    max_time: 30.0
    time_intervals: 101
    solver_accuracy: "high"
  frequency: 30.0
external:
  buffer_time: 1.0  # seconds
  mod_buffer_time: 5.0  # seconds
limits:  # Make sure these are aligned with env.yaml
  max_acc: 0.5
  min_acc: -0.5
  max_vel: 0.5
  min_vel: 0.0
  max_omega: 1.0

asif:
  gamma: 0.5
  slack: True
  weighting: [15.0, 1.0]


  
